services:
  lx-cue:
    build: .
    image: lx-cue:latest
    container_name: lx-cue
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口。可用环境变量 HOST_PORT 覆盖宿主机端口
      - "${HOST_PORT:-3000}:3000"
    environment:
      # 容器内监听
      HOST: "0.0.0.0"
      PORT: "3000"
      DB_PATH: "/app/data/lx-cue.db"
    volumes:
      - lx-cue-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  lx-cue-data:
